name: Build ePPT APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Convert PowerPoint to slide images
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-impress poppler-utils
          mkdir -p app/src/main/assets/slides /tmp/eppt_render
          timeout 600 libreoffice -env:UserInstallation=file:///tmp/lo_eppt_ci --headless --convert-to pdf --outdir /tmp/eppt_render ePPT.pptx
          test -s /tmp/eppt_render/ePPT.pdf
          pdftoppm -jpeg -r 120 -jpegopt quality=85 /tmp/eppt_render/ePPT.pdf app/src/main/assets/slides/slide
          test "$(find app/src/main/assets/slides -name '*.jpg' | wc -l)" -gt 0
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ePPT-apk
          path: app/build/outputs/apk/debug/app-debug.apk